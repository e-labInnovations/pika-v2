# Builds the production deploy artifact on a Linux x64 runner and publishes it
# as an asset on a rolling prerelease, so the VPS can fetch it with plain curl
# and no credentials at all.
#
# Why CI and not your laptop: `next build --output standalone` traces
# node_modules *from the build machine*. A macOS/arm64 laptop resolves
# @img/sharp-darwin-arm64 and onnxruntime-node's darwin binding, neither of
# which can load on the linux/x64 VPS — and payload.config.ts imports sharp at
# module scope, so the whole app dies. The runner's architecture has to match
# the server's.
#
# The build makes no database connection: the only route that queried Payload
# at build time was (frontend)/[slug], and it is now force-dynamic. DATABASE_URL
# below is a placeholder that is never dialled.
#
# Deploying is a separate, manual step — see scripts/deploy.sh.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create/update the rolling release and upload the tarball to it.
permissions:
  contents: write

env:
  NODE_VERSION: '22'
  # Rolling prerelease that always carries the most recent builds. Not marked
  # "latest", so it stays out of the way of real version releases.
  RELEASE_TAG: deploy-latest
  # How many build tarballs to keep attached to it.
  KEEP_ASSETS: '5'

concurrency:
  # Two pushes in quick succession would otherwise race on the same release.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose: the action reads package.json's
      # `packageManager` field, so the lockfile and CI can't drift apart.
      # A pnpm major mismatch fails as ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so
          # these are baked in here and cannot be changed by shared/.env later.
          # NEXT_PUBLIC_SERVER_URL is the canonical public origin used by the
          # OAuth discovery documents and MCP metadata; get it wrong and MCP
          # clients fail discovery against a localhost issuer.
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'https://pika.elabins.com' }}
          NEXT_PUBLIC_PAYLOAD_AUTH_URL: ${{ vars.NEXT_PUBLIC_PAYLOAD_AUTH_URL || 'https://pika.elabins.com' }}
          # Placeholders. Nothing connects or authenticates during the build;
          # the real values come from shared/.env at runtime.
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          PAYLOAD_SECRET: build-time-placeholder-not-used-at-runtime
          # `next build` runs with NODE_ENV=production and initialises Payload
          # while collecting page data, which is enough to trigger
          # prodMigrations against whatever DATABASE_URL is in scope. Belt and
          # braces alongside the NEXT_PHASE check in payload.config.ts, because
          # static generation runs in forked worker processes.
          PAYLOAD_DISABLE_PROD_MIGRATIONS: 'true'
          NODE_OPTIONS: '--no-deprecation --max-old-space-size=8000'
        run: pnpm build

      - name: Assemble artifact
        run: |
          set -euo pipefail

          # Next writes the traced server + node_modules here, but leaves the
          # static chunks and public/ for us to place ourselves.
          mkdir -p dist
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static

          # public/ includes lucide.svg, generated by the prebuild script and
          # read at runtime from `<cwd>/public/lucide.svg`.
          mkdir -p dist/public
          if [ -d public ]; then
            cp -r public/. dist/public/
          fi
          test -f dist/public/lucide.svg \
            || { echo "::error::public/lucide.svg missing — the prebuild copy-sprite step did not run"; exit 1; }

          cp ecosystem.config.cjs dist/

          # The onnxruntime addon is required through a template literal that
          # the tracer cannot resolve, so next.config.mjs names the linux/x64
          # build explicitly. If that include ever silently stops matching,
          # embeddings die at runtime with "cannot find module" — catch it here.
          if ! find dist -path '*onnxruntime-node/bin/napi-v6/linux/x64/onnxruntime_binding.node' | grep -q .; then
            echo "::error::onnxruntime linux/x64 binding missing — check outputFileTracingIncludes in next.config.mjs"
            exit 1
          fi

          # Same for sharp: payload.config.ts imports it at module scope, so a
          # missing linux binary takes down the entire app on first boot.
          if ! find dist -path '*@img/sharp-linux-x64*' | grep -q .; then
            echo "::error::@img/sharp-linux-x64 missing from the traced output"
            exit 1
          fi

          # next.config.mjs excludes these from tracing, but the tracer decides
          # what to copy by statically analysing path expressions, so a new
          # `path.resolve` somewhere in the source can silently start pulling a
          # directory in again. Fail loudly rather than ship secrets, uploads,
          # or model weights inside a release.
          for forbidden in .env .env.local .env.production media .cache; do
            if [ -e "dist/$forbidden" ]; then
              echo "::error::$forbidden leaked into the artifact — check outputFileTracingExcludes in next.config.mjs"
              exit 1
            fi
          done

          # Tar rather than upload the tree directly: the traced node_modules is
          # tens of thousands of small files, and a release asset has to be a
          # single file anyway.
          tar -czf "pika-${GITHUB_SHA}.tar.gz" -C dist .
          ls -lh "pika-${GITHUB_SHA}.tar.gz"

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The repo is public, so an asset on a release is downloadable with a
          # plain unauthenticated curl. That is the whole reason for preferring
          # a release over an Actions artifact: the VPS needs no token, no gh,
          # and holds no credential for GitHub at all.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --latest=false \
              --title "Deploy builds" \
              --notes "Rolling build artifacts for scripts/deploy.sh."
          fi

          gh release upload "$RELEASE_TAG" "pika-${SHA}.tar.gz" --clobber

          # Point the notes at what just landed, so the release page says which
          # commit the newest asset came from.
          {
            printf 'Rolling build artifacts for `scripts/deploy.sh`. Not a version release.\n\n'
            printf 'Latest: `pika-%s.tar.gz`\n\n' "$SHA"
            printf -- '- commit: %s\n' "$SHA"
            printf -- '- branch: %s\n' "$GITHUB_REF_NAME"
            printf -- '- built: %s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md

          # Prune. Each artifact is a few hundred MB and the rolling release
          # would otherwise grow without bound. Keeps the newest KEEP_ASSETS.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets | sort_by(.created_at) | reverse | .[] | "\(.id) \(.name)"' \
            | tail -n "+$((KEEP_ASSETS + 1))" \
            | while read -r id name; do
                echo "pruning $name"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              done

          echo "published pika-${SHA}.tar.gz to $RELEASE_TAG"
